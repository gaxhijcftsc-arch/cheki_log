<!DOCTYPE html>

<html lang="ja">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>テスト2</title>
<style>
body{padding:20px;background:#f0f0f0;font-family:sans-serif;max-width:480px;margin:0 auto;}
button{display:block;width:100%;padding:20px;margin:10px 0;font-size:18px;border:none;border-radius:12px;cursor:pointer;}
#screen{background:#fff;padding:20px;border-radius:12px;margin-bottom:10px;font-size:16px;min-height:60px;}
</style>
</head>
<body>
<div id="screen">画面1：登録</div>
<button style="background:#333;color:#fff;" id="b1">タブ1（登録）</button>
<button style="background:#6c63ff;color:#fff;" id="b2">タブ2（カレンダー）</button>
<button style="background:#4caf50;color:#fff;" id="b3">タブ3（集計）</button>
<label for="photo" style="display:block;background:#e76f51;color:#fff;padding:20px;border-radius:12px;text-align:center;font-size:18px;cursor:pointer;">📷 写真を選ぶ</label>
<input type="file" id="photo" accept="image/*" style="display:none"/>
<img id="preview" style="width:100%;border-radius:12px;margin-top:10px;display:none"/>
<script>
document.getElementById("b1").addEventListener("click",function(){document.getElementById("screen").textContent="画面1：登録 ✅";});
document.getElementById("b2").addEventListener("click",function(){document.getElementById("screen").textContent="画面2：カレンダー ✅";});
document.getElementById("b3").addEventListener("click",function(){document.getElementById("screen").textContent="画面3：集計 ✅";});
document.getElementById("photo").addEventListener("change",function(e){
  var f=e.target.files[0];
  if(!f)return;
  var r=new FileReader();
  r.onload=function(ev){
    var img=document.getElementById("preview");
    img.src=ev.target.result;
    img.style.display="block";
    document.getElementById("screen").textContent="写真選択 ✅";
  };
  r.readAsDataURL(f);
});
</script>
</body>
</html>
